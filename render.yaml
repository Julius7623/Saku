# Blueprint Render Static Site (Render tidak membaca file _headers; isi header harus sama dengan public/_headers)
services:
  - type: web
    runtime: static
    name: catat
    buildCommand: echo "Tidak ada proses build"
    staticPublishPath: public
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: "same-origin"
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: "none"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
