<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme:dark)">
<title>Saku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <button id="prev" aria-label="Bulan sebelumnya">‹</button>
    <h1 id="mon">Saku</h1>
    <button id="next" aria-label="Bulan berikutnya">›</button>
  </header>

  <section class="hero">
    <p class="t2">Sisa bulan ini</p>
    <p id="bal" aria-live="polite">Rp 0</p>
    <p class="sub"><span>Masuk <b id="in">Rp 0</b></span><span>Keluar <b id="out">Rp 0</b></span></p>
  </section>

  <p id="nudge" class="t2" hidden>Sudah sebulan belum dicadangkan. <button class="lnk" id="nb">Cadangkan</button></p>
  <ul id="cats" class="bars"></ul>
  <div id="list"></div>
  <button class="lnk" id="bk">Cadangkan atau pulihkan data</button>
</main>

<button class="fab" id="add">+ Catat</button>
<div class="toast" id="toast" hidden role="status"><span id="tm"></span><button class="lnk" id="ta" hidden></button></div>

<dialog id="sheet" aria-label="Catat transaksi">
  <div class="seg" role="tablist">
    <button id="s-out" role="tab" type="button">Keluar</button>
    <button id="s-in" role="tab" type="button">Masuk</button>
  </div>
  <label class="amt"><span>Rp</span><input id="amt" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Nominal"></label>
  <p id="err" class="err" role="alert"></p>
  <div class="chips" id="chips"></div>
  <input class="f" id="note" maxlength="100" placeholder="Catatan (opsional)" aria-label="Catatan">
  <input class="f" id="date" type="date" aria-label="Tanggal">
  <button class="pri" id="save" type="button">Simpan</button>
  <button class="lnk" id="del" type="button" hidden>Hapus catatan ini</button>
</dialog>

<dialog id="bkd" aria-label="Cadangan data">
  <h2>Cadangan data</h2>
  <p class="t2">Data hanya ada di perangkat ini. Simpan cadangan agar tidak hilang saat ganti HP atau hapus data browser.</p>
  <button class="pri" id="exp" type="button">Simpan cadangan</button>
  <button class="pri alt" id="imb" type="button">Pulihkan dari file</button>
  <input type="file" id="imp" accept="application/json" hidden>
</dialog>

<script src="app.js"></script>
</body>
</html>
